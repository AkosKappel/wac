# the visitor's IP comes from the Tailscale sidecar, which reaches nginx over a Docker
# network (all in 172.16.0.0/12); requests without the header keep the peer address
set_real_ip_from 172.16.0.0/12;
real_ip_header X-Forwarded-For;

# rate limits keyed by the visitor (set by the sidecar), not the sidecar itself;
# local requests have no X-Forwarded-For, and an empty key would never be limited
map $http_x_forwarded_for $client_key {
    ""      $binary_remote_addr;
    default $http_x_forwarded_for;
}
limit_req_zone $client_key zone=general:10m rate=10r/s;
# API writes (create/update/delete); reads get an empty key, which is never limited
map $request_method $write_key {
    GET     "";
    HEAD    "";
    default $client_key;
}
limit_req_zone $write_key zone=writes:10m rate=30r/m;
limit_req_status 429;

server {
    listen 80;
    server_name _;
    access_log /var/log/nginx/access.log combined;
    # a copy on the host for the traffic dashboard (ACCESS_LOG_DIR in .env)
    access_log /var/log/nginx/shared/access.log combined;
    error_log  /var/log/nginx/error.log;
    server_tokens off;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # Google Fonts serve the Inter and Material Symbols fonts
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'self'; form-action 'self'" always;

    # entries are small JSON documents
    client_max_body_size 64k;

    root /usr/share/nginx/html;

    location ^~ /api/ {
        limit_req zone=general burst=40 nodelay;
        limit_req zone=writes burst=10 nodelay;

        # Docker's DNS; re-resolve the API container so recreating it doesn't leave a stale IP
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $api_upstream http://api:8080;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $http_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_pass $api_upstream;
    }

    # a missing file (favicon.ico, a stale bundle) is a 404, not the app shell
    location ~ \.[a-z0-9]+$ {
        limit_req zone=general burst=40 nodelay;
        try_files $uri =404;
    }

    # the app routes in the browser (/entry/<id>), so unknown paths get the shell
    location / {
        limit_req zone=general burst=40 nodelay;
        try_files $uri /index.html;
    }
}
