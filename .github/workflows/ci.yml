name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: wac-api
    services:
      mongo:
        image: mongo:8.0
        env:
          MONGO_INITDB_ROOT_USERNAME: root
          MONGO_INITDB_ROOT_PASSWORD: ci-only-password
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand(\"ping\")'"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      # runs the integration test against the service container
      AMBULANCE_API_MONGODB_HOST: localhost
      AMBULANCE_API_MONGODB_PORT: "27017"
      AMBULANCE_API_MONGODB_USERNAME: root
      AMBULANCE_API_MONGODB_PASSWORD: ci-only-password
      AMBULANCE_API_MONGODB_DATABASE: ambulance-ci
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27"
          cache-dependency-path: wac-api/go.sum
      - name: Format
        run: test -z "$(gofmt -l . | tee /dev/stderr)"
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -race ./...
      - name: Vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

  ufe:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: wac-ufe
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: wac-ufe/package-lock.json
      - run: npm ci
      - name: Format
        run: npm run lint
      - name: Vulnerabilities
        run: npm audit --omit=dev
      - name: Build (includes the type check)
        run: npm run build
      - name: Spec and end-to-end tests
        run: npm test

  generated:
    name: Generated API code is up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27"
          cache: false
      - run: scripts/generate-api.sh
      - name: Compare with the committed files
        run: git diff --exit-code && test -z "$(git status --porcelain)"

  images:
    name: Images
    needs: [api, ufe, generated]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - name: wac-api
            context: wac-api
            file: wac-api/build/docker/Dockerfile
          - name: wac-nginx
            context: .
            file: docker/nginx/Dockerfile
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/akoskappel/${{ matrix.name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha
      # pull requests only build, to catch Dockerfile breakage; main also pushes to GHCR
      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
