# Public HTTPS entry point: a Tailscale sidecar that serves the app at
# https://ambulance.tailb52c43.ts.net via Funnel, proxying to nginx on app-network.
# Enabled through COMPOSE_FILE in .env.
services:
  tailscale:
    image: tailscale/tailscale:v1.104.1
    container_name: ambulance-tailscale
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 256M
    env_file:
      - tailscale/ts.env
    environment:
      TS_HOSTNAME: ambulance
      TS_EXTRA_ARGS: --advertise-tags=tag:container
      TS_SERVE_CONFIG: /config/serve.json
      TS_STATE_DIR: /var/lib/tailscale
      TS_USERSPACE: "true"
    volumes:
      - tailscale-state:/var/lib/tailscale
      - ./tailscale/serve.json:/config/serve.json:ro
    networks:
      - app-network
    depends_on:
      - nginx

volumes:
  tailscale-state:
